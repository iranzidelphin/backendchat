name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            https://backendchat-nu8b.onrender.com/
